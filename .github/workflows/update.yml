name: 更新場次

on:
  schedule:
    # 台灣時間 07:17～23:17 每小時一次（UTC 23:17～15:17）
    - cron: '17 23,0-15 * * *'
  workflow_dispatch:
  push:
    branches: [v2]
    paths: ['scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update-showtimes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安裝工具
        run: npm i --no-save --no-audit --no-fund playwright-core@1.49.1 sharp@0.33.5
      - name: 抓場次、IMDb、海報
        run: node scripts/scrape.mjs
      - name: 有變動才存檔
        run: |
          git config user.name "showtime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data posters
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新場次 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X ours origin "${GITHUB_REF_NAME}" || true
            git push
          fi
