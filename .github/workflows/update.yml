name: 更新場次

on:
  schedule:
    # 台灣時間 07:17～23:17 每小時一次（UTC 23:17～15:17）
    - cron: '17 23,0-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-showtimes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 抓場次
        run: node scripts/scrape.mjs
      - name: 有變動才存檔
        run: |
          git config user.name "showtime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/showtimes.json
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新場次 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
